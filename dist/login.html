<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Toca dos Ratinhos</title>
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>

<body class="pagina-login">
    <main class="container">
        <a class="voltar" href="index.html">← Voltar ao site</a>
        <h1>Área de aprendizagem</h1>
        <p class="intro">Entre na sua conta para continuar.</p>

        <section class="quadro">
            <h2>Entrar</h2>
            <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>

            <form id="form-login">
                <label for="login-email">E-mail</label>
                <input id="login-email" name="email" type="email" autocomplete="email" required>

                <label for="login-senha">Senha</label>
                <input id="login-senha" name="password" type="password" autocomplete="current-password" required>

                <button type="submit">Entrar</button>
            </form>

            <p class="ajuda">
                Ainda não tem conta? <a href="cadastro.html">Criar conta</a>
            </p>
        </section>
    </main>
</body>

</html>
